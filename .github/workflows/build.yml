name: Build iStoreOS for JDCloud RE-SP-01B
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@main
      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext \
            git libncurses5-dev libz-dev patch python3 python3-pip python3-setuptools \
            rsync subversion unzip zlib1g-dev flex bison libssl-dev quilt wget
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
      - name: 克隆 iStoreOS 源码
        run: |
          git clone -b istoreos-25.12 --depth 1 https://github.com/istoreos/istoreos.git openwrt
          cd openwrt
      - name: 更新 feeds（执行 diy-part1）
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh
          ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 应用定制（执行 diy-part2）
        run: |
          cd openwrt
          chmod +x ../diy-part2.sh
          ../diy-part2.sh
      - name: 导入设备配置
        run: |
          cd openwrt
          cp ../config/jdcloud.config .config
          make defconfig
      - name: 开始编译
        id: build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "========================="
          echo "编译完成，固件列表如下："
          find bin/targets -name "*.bin" -o -name "*.img" | sort
      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ success() && steps.build.outcome == 'success' }}
        with:
          name: iStoreOS-JDCloud-RE-SP-01B
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.img
            
